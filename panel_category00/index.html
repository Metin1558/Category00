<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>organoid — kademe 0 live</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0c0a08; font-family: 'JetBrains Mono', monospace;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  #rig { width: 900px; border-radius: 18px; overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.6); }
  #stage { display: block; background: #F3EBDA; }
  #controls { background: #16130f; padding: 12px 20px; display: flex; align-items: center; gap: 14px; border-top: 1px solid #2a251d; }
  #controls .dot { width: 8px; height: 8px; border-radius: 50%; background: #5a5148; }
  #controls .dot.rec { background: #d94f4f; box-shadow: 0 0 8px rgba(217,79,79,.7); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  #controls .label { color: #a89f8f; font-size: 12px; letter-spacing: .06em; }
  #controls .status { margin-left: auto; color: #6b6153; font-size: 11px; }
</style>
</head>
<body>

<div id="rig">
  <canvas id="stage" width="900" height="600"></canvas>
  <div id="controls">
    <div class="dot" id="recDot"></div>
    <div class="label" id="recLabel">recording will start automatically</div>
    <div class="status" id="status">connecting…</div>
  </div>
</div>

<script>
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const TOP_H = 380;
const BOT_H = H - TOP_H;

const CREAM='#F3EBDA', INK='#3B3226', INK_DIM='#8A7D68';
const DARK='#14120E', DARK2='#1D1A15', LIVE='#E9A23B', OK='#7FA875', BAD='#C56B5C';
const TEXT_D='#C9BFAE', TEXT_DM='#6B6153';

let state = {phase:'idle', train_progress:0, live_progress:0, current_trial:null,
            running_accuracy:null, finished:false};

let shownLabel = null;
let lastKey = null;

function trialKey(t){ return t ? (t.true_label + '|' + t.confidence) : null; }

function roundRectPath(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function draw(){
  ctx.fillStyle = CREAM; ctx.fillRect(0,0,W,TOP_H);
  ctx.font='600 12px JetBrains Mono'; ctx.fillStyle=INK_DIM; ctx.textAlign='center';
  ctx.fillText('CATEGORY00 — the simplest possible categorical task', W/2, 34);
  ctx.strokeStyle='rgba(59,50,38,0.25)';
  ctx.beginPath(); ctx.moveTo(W/2-140,46); ctx.lineTo(W/2+140,46); ctx.stroke();

  const t = state.current_trial;
  const key = trialKey(t);
  if (t && key !== lastKey){ lastKey = key; shownLabel = t; }

  // Left: which stimulus was shown (X or Y, giant letter)
  const lx = 220, ly = TOP_H/2 + 10;
  roundRectPath(lx-140, ly-110, 280, 220, 14);
  ctx.strokeStyle = 'rgba(59,50,38,0.3)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.font = "600 140px 'Fraunces', serif"; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = shownLabel ? INK : 'rgba(59,50,38,0.15)';
  ctx.fillText(shownLabel ? shownLabel.true_label : '?', lx, ly);
  ctx.textBaseline = 'alphabetic';
  ctx.font = '11px JetBrains Mono'; ctx.fillStyle = INK_DIM;
  ctx.fillText('electrode ' + (shownLabel && shownLabel.true_label === 'Y' ? '1' : '0') + ' fired, once', lx, ly + 128);

  // Right: diagnosis
  const rx = 560;
  ctx.textAlign = 'left';
  ctx.font = '11px JetBrains Mono'; ctx.fillStyle = INK_DIM;
  ctx.fillText('ORGANOID CALL', rx, 90);

  if (shownLabel){
    const isX = shownLabel.diagnosis === 'X';
    ctx.font = "600 64px 'Fraunces', serif";
    ctx.fillStyle = shownLabel.correct ? OK : BAD;
    ctx.fillText(shownLabel.diagnosis, rx, 165);

    ctx.font = '12px JetBrains Mono'; ctx.fillStyle = INK_DIM;
    ctx.fillText('confidence', rx, 195);
    ctx.font = '16px JetBrains Mono'; ctx.fillStyle = INK;
    ctx.fillText((shownLabel.confidence*100).toFixed(0)+'%', rx, 217);

    ctx.font = '13px JetBrains Mono';
    ctx.fillStyle = shownLabel.correct ? OK : BAD;
    ctx.fillText(shownLabel.correct ? '✓ correct call' : '✗ missed', rx, 245);
  } else {
    ctx.font = '13px JetBrains Mono'; ctx.fillStyle = INK_DIM;
    ctx.fillText('watching…', rx, 165);
  }

  if (state.running_accuracy != null){
    ctx.font = '11px JetBrains Mono'; ctx.fillStyle = INK_DIM;
    ctx.fillText('running accuracy: ' + (state.running_accuracy*100).toFixed(0) + '%  (chance = 50%)', rx, 290);
  }

  const phaseLabel = {idle:'idle', training:'training readout…', live:'live diagnosis running', complete:'session complete'}[state.phase]||'';
  ctx.font='11px JetBrains Mono'; ctx.fillStyle=INK_DIM; ctx.textAlign='center';
  ctx.fillText(phaseLabel, W/2, TOP_H-14);

  // bottom technical panel
  ctx.fillStyle=DARK; ctx.fillRect(0,TOP_H,W,BOT_H);
  ctx.fillStyle=DARK2; ctx.fillRect(0,TOP_H,W,34);
  ctx.font='600 11px JetBrains Mono'; ctx.fillStyle=TEXT_DM; ctx.textAlign='left';
  ctx.fillText('TECHNICAL READOUT', 24, TOP_H+22);

  if (state.phase === 'training'){
    ctx.font='12px JetBrains Mono'; ctx.fillStyle=TEXT_D;
    ctx.fillText('training progress: ' + ((state.train_progress||0)*100).toFixed(0) + '%', 24, TOP_H+60);
    const bx=24, by=TOP_H+72, bw=W-48, bh=14;
    roundRectPath(bx,by,bw,bh,7); ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.stroke();
    roundRectPath(bx,by,Math.max(14,bw*(state.train_progress||0)),bh,7); ctx.fillStyle=LIVE; ctx.fill();
  } else if (shownLabel){
    ctx.font='11px JetBrains Mono'; ctx.fillStyle=TEXT_DM;
    ctx.fillText('total organoid firing', 24, TOP_H+58);
    ctx.font='16px JetBrains Mono'; ctx.fillStyle=TEXT_D;
    ctx.fillText(shownLabel.total_firing, 24, TOP_H+80);

    ctx.font='11px JetBrains Mono'; ctx.fillStyle=TEXT_DM;
    ctx.fillText('active electrodes', 300, TOP_H+58);
    ctx.font='16px JetBrains Mono'; ctx.fillStyle=TEXT_D;
    ctx.fillText(shownLabel.active_electrodes + ' / 32', 300, TOP_H+80);

    ctx.font='11px JetBrains Mono'; ctx.fillStyle=TEXT_DM;
    ctx.fillText('live progress', 580, TOP_H+58);
    ctx.font='16px JetBrains Mono'; ctx.fillStyle=TEXT_D;
    ctx.fillText(((state.live_progress||0)*100).toFixed(0)+'%', 580, TOP_H+80);
  }

  requestAnimationFrame(draw);
}
draw();

async function poll(){
  try {
    const r = await fetch('/api/state', {cache:'no-store'});
    state = await r.json();
    document.getElementById('status').textContent =
      {idle:'idle', training:'training…', live:'live', complete:'complete'}[state.phase] || '';
    if (state.finished) stopRecording();
  } catch(e) {}
  setTimeout(poll, 300);
}
poll();

let recorder, chunks=[];
function startRecording(){
  const stream = cv.captureStream(15);
  let mimeType = 'video/mp4';
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported(mimeType)){
    mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
  }
  recorder = new MediaRecorder(stream, {mimeType, videoBitsPerSecond:3_000_000});
  chunks=[];
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, {type:mimeType});
    const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const stamp = new Date().toISOString().replace(/[:.]/g,'-');
    a.download = `organoid_category00_${stamp}.${ext}`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    document.getElementById('recDot').classList.remove('rec');
    document.getElementById('recLabel').textContent = `saved: ${a.download}`;
  };
  recorder.start(500);
  document.getElementById('recDot').classList.add('rec');
  document.getElementById('recLabel').textContent = 'recording — will auto-save when the session completes';
}
function stopRecording(){ if (recorder && recorder.state!=='inactive') recorder.stop(); }
window.addEventListener('load', () => setTimeout(startRecording, 600));
</script>
</body>
</html>
